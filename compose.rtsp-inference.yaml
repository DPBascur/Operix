# Optional candidate for the RTSP lab. Use with compose.gpu.yaml and compose.rtsp-lab.yaml.
services:
  backend:
    environment:
      OPERIX_RTSP_INFERENCE_SOCKET: /var/lib/operix/rtsp-inference/private/worker.sock
    volumes:
      - rtsp_inference:/var/lib/operix/rtsp-inference:ro
    depends_on:
      rtsp-inference:
        condition: service_started
  rtsp-inference:
    image: operix-backend:local
    user: "10001:10001"
    init: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "on-failure:3"
    stop_grace_period: 15s
    environment:
      OPERIX_RTSP_INFERENCE: "1"
      YOLO_CONFIG_DIR: /tmp/operix-yolo
      TMPDIR: /tmp
      HOME: /tmp
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=0700
    command:
      - python
      - /app/engine/scripts/run_rtsp_inference.py
      - --socket
      - /var/lib/operix/rtsp-inference/private/worker.sock
      - --person-weights
      - /data/weights/person.pt
      - --forklift-weights
      - /data/weights/forklift.pt
      - --width
      - ${OPERIX_CAMERA_LAB_WIDTH:-960}
      - --height
      - ${OPERIX_CAMERA_LAB_HEIGHT:-540}
      - --batch-cap
      - ${OPERIX_RTSP_BATCH_CAP:-2}
      - --batch-wait-ms
      - ${OPERIX_RTSP_BATCH_WAIT_MS:-6}
    volumes:
      - rtsp_inference:/var/lib/operix/rtsp-inference
      - type: bind
        source: ${OPERIX_PERSON_WEIGHTS_HOST:?Ruta del checkpoint PERSON vigente}
        target: /data/weights/person.pt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${OPERIX_FORKLIFT_WEIGHTS_HOST:?Ruta del checkpoint FORKLIFT vigente}
        target: /data/weights/forklift.pt
        read_only: true
        bind:
          create_host_path: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: [CMD, python, /app/engine/scripts/run_rtsp_inference.py, --check-ready, --socket, /var/lib/operix/rtsp-inference/private/worker.sock]
      interval: 5s
      timeout: 2s
      retries: 6
      start_period: 25s
volumes:
  rtsp_inference:
