logLevel: info
api: true
apiAddress: 127.0.0.1:9997
rtsp: true
rtspAddress: :8554
rtspTransports: [tcp]
rtmp: false
hls: false
webrtc: false
srt: false
moq: false

authInternalUsers:
  - user: any
    ips: [127.0.0.1]
    permissions:
      - action: api
  # Only trusted lab-network members can reach RTSP.
  - user: any
    permissions:
      - action: publish
        path: lab-cam-01
      - action: publish
        path: lab-cam-02
      - action: read
        path: lab-cam-01
      - action: read
        path: lab-cam-02

pathDefaults:
  overridePublisher: false
paths:
  lab-cam-01: {}
  lab-cam-02: {}
